<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Regan Anto</title>
    <script>
      // GitHub Pages SPA fallback (rafgraph/spa-github-pages).
      // Turns /regan-portfolio/dotnet into /regan-portfolio/?/dotnet so index.html can restore it.
      // Keep 1 path segment because the site lives at /regan-portfolio.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
